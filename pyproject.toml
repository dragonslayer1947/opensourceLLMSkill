[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "0.1.0"
description = "Cost-efficient multi-model coding CLI. A local model does the work inside its parity envelope; a frontier model only decomposes hard tasks into small ones."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.40",
    "anthropic>=0.34",
]

[project.optional-dependencies]
# Deterministic verification gate tools. Install to enable type/lint/security/test checks.
validate = ["mypy>=1.10", "ruff>=0.5", "bandit>=1.7", "pytest>=8.0"]

[project.scripts]
devagent = "devagent.cli:app"

[tool.setuptools.packages.find]
include = ["devagent*"]
