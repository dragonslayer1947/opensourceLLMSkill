[build-system]
requires = ["setuptools>=77"]   # >=77 for PEP 639 SPDX `license` + `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "0.1.0"
description = "Cost-efficient multi-model coding CLI. A local model does the work inside its parity envelope; a frontier model only decomposes hard tasks into small ones."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0",       # interactive shell (REPL); falls back to input() if absent
    "openai>=1.40",
    "anthropic>=0.34",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
]

[project.optional-dependencies]
# Deterministic verification gate tools. Install to enable type/lint/security/test checks.
validate = ["mypy>=1.10", "ruff>=0.5", "bandit>=1.7", "pytest>=8.0"]

[project.scripts]
devagent = "devagent.cli:app"

[tool.setuptools.packages.find]
include = ["devagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
